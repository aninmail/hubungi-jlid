<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hubungi Admin JualinLaptop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --mint:#67C4A9; --pine:#2E4F49; --gold:#E8A53D; --cream:#F4F2EA; --white:#FFFFFF;
    --pine-2:#355B54; --line:#D9DED9;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100vh; background:var(--cream); color:var(--pine);
    font-family:"Inter",system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
  }
  .wrap{width:100%; max-width:440px; padding:0 20px 40px}
  header{
    background:var(--pine); color:var(--white); margin:0 -20px; padding:36px 24px 56px;
    text-align:center; position:relative; overflow:hidden; border-radius:0 0 28px 28px;
  }
  header::after{
    content:""; position:absolute; width:260px; height:260px; border-radius:50%;
    background:var(--mint); opacity:.18; top:-120px; right:-90px;
  }
  .logo{
    width:76px; height:76px; border-radius:50%; background:var(--mint); color:var(--white);
    display:grid; place-items:center; margin:0 auto 14px;
    font-family:"Poppins",sans-serif; font-weight:800; font-size:24px; letter-spacing:.5px;
    position:relative; z-index:1;
  }
  .brand{font-family:"Poppins",sans-serif; font-weight:700; font-size:26px; margin:0; position:relative; z-index:1}
  .brand span{color:var(--mint)}
  .tag{margin:8px 0 0; font-size:15px; opacity:.9; position:relative; z-index:1}
  .card{
    background:var(--white); border-radius:20px; padding:20px 18px; margin-top:-32px;
    position:relative; z-index:2; box-shadow:0 6px 24px rgba(46,79,73,.10);
  }
  .card h2{font-family:"Poppins",sans-serif; font-size:17px; font-weight:600; margin:0 0 4px}
  .card p{margin:0 0 16px; font-size:14px; color:#4d6964}
  .list{display:flex; flex-direction:column; gap:10px}
  .btn{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--pine);
    background:var(--cream); border:1.5px solid var(--line); border-radius:16px;
    padding:14px 16px; font-weight:600; font-size:16px;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .btn:hover,.btn:focus-visible{border-color:var(--mint); background:#ECF6F2; outline:none}
  .btn:active{transform:scale(.98)}
  .wa{
    width:40px; height:40px; flex:none; border-radius:50%; background:var(--pine);
    display:grid; place-items:center;
  }
  .wa svg{width:22px; height:22px; fill:var(--white)}
  .txt{display:flex; flex-direction:column; flex:1; min-width:0}
  .txt small{font-weight:500; font-size:13px; color:#5b7671; margin-top:2px}
  .arrow{font-family:"Poppins",sans-serif; font-size:20px; color:var(--mint)}
  footer{text-align:center; font-size:13px; color:#5b7671; margin-top:22px; line-height:1.5}
  footer a{color:var(--pine); font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">JLID</div>
    <h1 class="brand"><span>Jualin</span>Laptop</h1>
    <p class="tag">Jual &amp; beli laptop bekas, langsung ke admin cabang terdekat</p>
  </header>

  <main class="card">
    <h2>Pilih cabang terdekat</h2>
    <p>Klik cabang, kamu akan langsung terhubung ke WhatsApp admin.</p>
    <nav class="list" id="list" aria-label="Daftar cabang"></nav>
  </main>

  <footer>
    Jam layanan mengikuti jam buka masing-masing cabang.<br>
    <a href="https://jualinlaptop.id" target="_blank" rel="noopener">jualinlaptop.id</a>
  </footer>
</div>

<script>
  // Nomor WA admin sales per cabang (format 62…)
  const CABANG = [
    { nama: "Jakarta",   wa: "6285281374735" },
    { nama: "Bogor",     wa: "6282371827137" },
    { nama: "Depok",     wa: "6282261058905" },
    { nama: "Tangerang", wa: "6281214186381" },
    { nama: "Bekasi",    wa: "6282113833787" },
    { nama: "Bandung",   wa: "6281318933669" },
    { nama: "Jogja",     wa: "6285284112214" }
  ];

  // Deteksi asal pengunjung: 1) parameter ?src= di link bio, 2) browser bawaan aplikasi, 3) referrer
  function deteksiPlatform() {
    let q = "";
    try {
      const p = new URLSearchParams(location.search);
      q = (p.get("src") || p.get("utm_source") || "").toLowerCase();
    } catch (e) {}
    if (/^(ig|insta|instagram)/.test(q)) return "Instagram";
    if (/^(tt|tiktok)/.test(q)) return "TikTok";

    const ua = navigator.userAgent || "";
    if (/Instagram/i.test(ua)) return "Instagram";
    if (/musical_ly|BytedanceWebview|TikTok|trill_/i.test(ua)) return "TikTok";

    const ref = (document.referrer || "").toLowerCase();
    if (ref.includes("instagram.com")) return "Instagram";
    if (ref.includes("tiktok.com")) return "TikTok";

    return "";
  }

  const platform = deteksiPlatform();
  const pesan = platform
    ? `Hallo kak aku dari ${platform}, Aku liat dari postingan bisa jual/beli laptop ya kak ?`
    : `Hallo kak, Aku liat dari postingan bisa jual/beli laptop ya kak ?`;

  const waIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></svg>';

  const list = document.getElementById("list");
  CABANG.forEach(c => {
    const a = document.createElement("a");
    a.className = "btn";
    a.href = `https://wa.me/${c.wa}?text=${encodeURIComponent(pesan)}`;
    a.target = "_blank";
    a.rel = "noopener";
    a.setAttribute("aria-label", `Chat WhatsApp admin cabang ${c.nama}`);
    a.innerHTML = `<span class="wa">${waIcon}</span>
      <span class="txt">Cabang ${c.nama}<small>Chat admin</small></span>
      <span class="arrow">›</span>`;
    list.appendChild(a);
  });
</script>
</body>
</html>
